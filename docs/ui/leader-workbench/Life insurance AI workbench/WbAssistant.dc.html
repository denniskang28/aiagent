<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-cb710465-178f-48eb-a563-3421b8f155b3/styles.css">
<script src="_ds/modernist-cb710465-178f-48eb-a563-3421b8f155b3/_ds_bundle.js"></script>
</helmet>
<div style="max-width:1360px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 160px)">
    <section><h6 style="margin:0 0 8px;color:var(--color-neutral-700)">{{ t.kicker }}</h6><h1 style="margin:0">{{ t.title }}</h1></section>
    <sc-if value="{{ emptyChat }}" hint-placeholder-val="{{ true }}">
      <div style="border-top:2px solid var(--color-text);padding:24px 0;display:flex;flex-direction:column;gap:12px">
        <p style="margin:0;font-size:18px;max-width:640px">{{ t.intro }}</p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <sc-for list="{{ prompts }}" as="p" hint-placeholder-count="8"><button onClick="{{ p.onClick }}" style="border:1px solid var(--color-divider);background:transparent;padding:12px 14px;text-align:left;cursor:pointer;font-size:14px;color:inherit" style-hover="background:var(--color-neutral-200)">{{ p.q }}</button></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="0">
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-if value="{{ m.user }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:flex-end;max-width:70%;background:var(--color-text);color:var(--color-bg);padding:12px 16px;font-size:15px">{{ m.q }}</div>
        </sc-if>
        <sc-if value="{{ m.ai }}" hint-placeholder-val="{{ false }}">
          <div class="card" style="padding:20px;gap:14px;border-top:4px solid var(--color-text);max-width:860px">
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600"><span style="background:var(--color-text);color:var(--color-bg);padding:2px 5px;font-weight:800">AI</span>{{ t.answer }}</span>
            <p style="margin:0;font-size:18px;font-weight:600">{{ m.summary }}</p>
            <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="2">
              <div style="display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--color-divider)">
                <b style="font-size:20px;color:var(--color-accent)">{{ it.n }}</b>
                <div style="display:flex;flex-direction:column;gap:4px">
                  <b style="font-size:16px">{{ it.name }}</b>
                  <div style="font-size:14px"><span style="color:var(--color-neutral-700)">{{ t.reason }}:</span> {{ it.reason }}</div>
                  <div style="font-size:14px"><span style="color:var(--color-neutral-700)">{{ t.recommended }}:</span> <b>{{ it.rec }}</b></div>
                  <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><sc-for list="{{ it.btns }}" as="b" hint-placeholder-count="1"><button class="btn btn-secondary" onClick="{{ b.onClick }}" style="font-size:13px;padding:6px 10px">{{ b.label }}</button></sc-for></div>
                </div>
              </div>
            </sc-for>
            <div style="font-size:12px;color:var(--color-neutral-700);border-top:1px solid var(--color-divider);padding-top:10px">{{ t.evidence }}: {{ m.evidence }}</div>
          </div>
        </sc-if>
        <sc-if value="{{ m.loading }}" hint-placeholder-val="{{ false }}">
          <div class="card" style="padding:16px 20px;gap:8px;max-width:420px"><span style="font-size:13px;font-weight:600">{{ t.thinking }}</span><div style="display:flex;gap:6px"><span style="width:10px;height:10px;background:var(--color-text);animation:lwbPulse 1s infinite"></span><span style="width:10px;height:10px;background:var(--color-text);animation:lwbPulse 1s .2s infinite"></span><span style="width:10px;height:10px;background:var(--color-text);animation:lwbPulse 1s .4s infinite"></span></div></div>
        </sc-if>
      </div>
    </sc-for>
    <div style="margin-top:auto;position:sticky;bottom:0;background:var(--color-bg);padding:12px 0;border-top:2px solid var(--color-text);display:flex;gap:8px">
      <input class="input" placeholder="{{ t.ph }}" value="{{ draft }}" onInput="{{ onDraft }}" onKeyDown="{{ onKey }}" style="min-height:44px;font-size:15px">
      <button class="btn btn-primary" onClick="{{ send }}" style="min-width:96px">{{ t.send }}</button>
    </div>
  </div>
  <aside style="position:sticky;top:96px;display:flex;flex-direction:column;gap:16px">
    <div style="border-bottom:2px solid var(--color-text);padding-bottom:8px"><h6 style="margin:0">{{ t.modes }}</h6></div>
    <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3"><div style="padding:0 0 12px;border-bottom:1px solid var(--color-divider)"><b style="font-size:14px">{{ m.n }}</b><div style="font-size:13px;color:var(--color-neutral-800)">{{ m.d }}</div></div></sc-for>
    <sc-if value="{{ hasMsgs }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><h6 style="margin:8px 0 0">{{ t.more }}</h6><sc-for list="{{ prompts }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.onClick }}" style="border:0;border-bottom:1px solid var(--color-divider);background:transparent;padding:8px 0;text-align:left;cursor:pointer;font-size:13px;color:inherit" style-hover="color:var(--color-accent-700)">{{ p.q }}</button></sc-for></div></sc-if>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const L = (o, l) => (o && typeof o === 'object' && 'en' in o) ? o[l] : o;
const T = { en: { kicker: 'AI Assistant', title: 'Ask about your team', intro: 'Secretary, Coach and Expert in one place. Ask in plain language — every answer shows the reason, the evidence and what you can do next.',
  answer: 'Answer', reason: 'Reason', recommended: 'Recommended', evidence: 'Based on', thinking: 'Looking at your team data…', ph: 'Ask anything about your agents, coaching or recruitment…', send: 'Ask', more: 'Try also',
  modes: 'How AI works with you', md: [['Chat', 'You ask; AI answers with evidence.'], ['Nudge', 'AI flags what needs you — prioritized, dismissible.'], ['Agentic', 'AI prepares plans, messages and tasks. You approve.']] },
  zh: { kicker: 'AI 助手', title: '问问您的团队', intro: '秘书、教练、专家三合一。用日常语言提问——每个回答都会说明原因、依据以及下一步行动。',
  answer: '回答', reason: '原因', recommended: '建议', evidence: '依据', thinking: '正在分析团队数据…', ph: '询问代理人、辅导或招募相关问题…', send: '提问', more: '还可以问',
  modes: 'AI 的协作方式', md: [['对话', '您提问，AI 结合依据回答。'], ['主动提醒', 'AI 标出需要您处理的事项——有优先级、可忽略。'], ['智能代办', 'AI 准备计划、消息与任务，由您确认。']] } };
const B = { agent: { en: 'View Agent', zh: '查看代理人' }, plan: { en: 'Create Coaching Plan', zh: '生成辅导计划' }, sp: { en: 'View Success Plan', zh: '查看成功计划' }, cand: { en: 'View Candidate', zh: '查看候选人' }, pitch: { en: 'Prepare Outreach', zh: '准备邀约' }, brief: { en: 'Open Coaching Brief', zh: '打开辅导简报' }, team: { en: 'Open Team Performance', zh: '打开团队业绩' }, pipe: { en: 'Open Pipeline', zh: '打开招募管道' } };
const A = {
  coach: { kw: ['coach', '辅导'], q: { en: 'Who should I coach this week?', zh: '本周应该辅导谁？' }, sum: { en: 'Three agents need attention.', zh: '有 3 名代理人需要关注。' }, items: [
    ['James Lee', { en: 'Proposal-to-close conversion dropped to 11%.', zh: '建议书成交转化率降至 11%。' }, { en: 'Objection-handling coaching.', zh: '异议处理辅导。' }, [['agent', 'agent', 'james'], ['plan', 'coaching']]],
    ['Emily Wong', { en: 'M1 customer activity is 25% below expected level.', zh: 'M1 客户活动量低于预期 25%。' }, { en: 'Prospecting coaching.', zh: '客户开拓辅导。' }, [['sp', 'successplan']]],
    ['David Chen', { en: 'Activity is 40% below his 3-month average.', zh: '活动量低于其近 3 个月平均 40%。' }, { en: 'Daily activity check-in for 2 weeks.', zh: '两周每日活动检视。' }, [['agent', 'agent', 'davidc']]]], ev: { en: 'Activity history, sales pipeline, performance metrics (Oct MTD)', zh: '活动记录、销售管道、业绩指标（10 月累计）' } },
  attention: { kw: ['attention', 'today', '关注', '今天'], q: { en: 'Which agents need my attention today?', zh: '今天哪些代理人需要我关注？' }, sum: { en: 'Two agents and one candidate need a decision today.', zh: '今天有 2 名代理人和 1 位候选人需要您决策。' }, items: [
    ['James Lee', { en: 'Close rate declined 3 weeks in a row; coaching due today 15:00.', zh: '成交率连续 3 周下降；今天 15:00 安排辅导。' }, { en: 'Review the AI coaching brief before the session.', zh: '辅导前查看 AI 辅导简报。' }, [['brief', 'coaching']]],
    ['Emily Wong', { en: 'Falling behind M1 activation target, 9 days left.', zh: 'M1 激活目标落后，剩余 9 天。' }, { en: 'Create a recovery plan.', zh: '生成恢复计划。' }, [['sp', 'successplan']]]], ev: { en: 'Nudges ranked by impact and urgency', zh: '按影响与紧急程度排序的提醒' } },
  team: { kw: ['below', 'target', 'why', '目标', '为什么'], q: { en: 'Why is my team below target?', zh: '为什么团队未达目标？' }, sum: { en: 'Team is 8% below target mainly because 4 agents have enough leads but low conversion.', zh: '团队低于目标 8%，主要因为 4 名代理人线索充足但转化偏低。' }, items: [
    [{ en: 'Conversion gap', zh: '转化差距' }, { en: 'James, Grace, Michael, Peter convert under 15% (benchmark 24%) — ~70% of the gap.', zh: 'James、Grace、Michael、Peter 转化率低于 15%（基准 24%），约占差距 70%。' }, { en: 'Group role play on premium objections.', zh: '开展保费异议小组演练。' }, [['team', 'team']]],
    [{ en: 'Activity gap', zh: '活动量差距' }, { en: 'David Chen\'s activity is well below average.', zh: 'David Chen 活动量明显低于平均。' }, { en: 'Daily check-in for 2 weeks.', zh: '两周每日检视。' }, [['agent', 'agent', 'davidc']]]], ev: { en: '12 agents, 8 weeks of pipeline data', zh: '12 名代理人、8 周管道数据' } },
  newrisk: { kw: ['new agent', 'risk', '新人', '风险'], q: { en: 'Which new agents are at risk?', zh: '哪些新人存在风险？' }, sum: { en: 'One of two new agents is at activation risk.', zh: '2 名新人中有 1 名存在激活风险。' }, items: [
    ['Emily Wong · M1', { en: 'Training on track, but prospecting contacts fell 14 → 9 → 6.', zh: '培训正常，但开拓接触由 14 → 9 → 6 下降。' }, { en: 'Focus on prospecting, not more training.', zh: '聚焦客户开拓，而非增加培训。' }, [['sp', 'successplan']]]], ev: { en: 'Milestone plans, activity history, training records', zh: '里程碑计划、活动记录、培训记录' } },
  cand: { kw: ['candidate', 'recruit', 'contact', '候选人', '招募', '联系'], q: { en: 'Which recruitment candidates should I contact first?', zh: '应该先联系哪些招募候选人？' }, sum: { en: 'Start with David Chan, then Cindy Ma.', zh: '建议先联系 David Chan，其次是 Cindy Ma。' }, items: [
    ['David Chan', { en: 'Fit 86, re-engaged twice this week, no contact from you in 5 days.', zh: '匹配度 86，本周两次互动，您已 5 天未联系。' }, { en: 'Invite to a career conversation.', zh: '邀约职业发展面谈。' }, [['cand', 'candidate', 'david'], ['pitch', 'pitch', 'david']]],
    ['Cindy Ma', { en: 'Engaged but no contact for 6 days.', zh: '有互动但已 6 天未联系。' }, { en: 'Send opportunity seminar invite.', zh: '发送说明会邀请。' }, [['cand', 'candidate', 'cindy']]]], ev: { en: 'Candidate profiles, engagement history', zh: '候选人档案、互动记录' } },
  james: { kw: ['james', 'summar', 'prepare', '总结', '准备'], q: { en: 'Summarize James before my coaching session.', zh: '辅导前帮我总结一下 James。' }, sum: { en: 'James has healthy activity but his close rate fell from 22% to 11%; premium objections caused 4 of 7 lost cases.', zh: 'James 活动量正常，但成交率从 22% 降至 11%；7 个流失案例中有 4 个因保费异议。' }, items: [
    [{ en: 'Coaching focus', zh: '辅导重点' }, { en: 'Objection-handling role play score 48 vs team 70.', zh: '异议处理演练得分 48，团队 70。' }, { en: 'Objection handling, value communication, closing practice.', zh: '异议处理、价值沟通、促成练习。' }, [['brief', 'coaching'], ['agent', 'agent', 'james']]]], ev: { en: 'Activity history, sales pipeline, role play results', zh: '活动记录、销售管道、角色演练结果' } },
  funnel: { kw: ['funnel', 'drop', '漏斗', '下降'], q: { en: 'What is causing our recruitment funnel drop?', zh: '招募漏斗下降的原因是什么？' }, sum: { en: 'Engaged → Interview conversion is 53% vs 70% benchmark — follow-up is too slow.', zh: '互动→面谈转化率 53%，基准 70%——跟进速度太慢。' }, items: [
    [{ en: 'Slow follow-up', zh: '跟进不及时' }, { en: 'Average 6 days from engagement to interview invite (benchmark 2).', zh: '从互动到邀约面谈平均 6 天（基准 2 天）。' }, { en: 'Contact the 4 engaged candidates this week.', zh: '本周联系 4 名已互动候选人。' }, [['pipe', 'recruitment']]]], ev: { en: 'Recruitment pipeline, engagement history', zh: '招募管道、互动记录' } }
};
const ORDER = ['attention', 'team', 'coach', 'newrisk', 'cand', 'james', 'funnel'];
class Component extends DCLogic {
  state = { msgs: [], draft: '' };
  componentDidMount() { const app = this.props.app; if (app && app.s && app.s.askQ) { const q = app.s.askQ; app.set({ askQ: null }); this.ask(q); } }
  componentWillUnmount() { clearTimeout(this._t); }
  ask(q, key) {
    if (!key) { const ql = q.toLowerCase(); key = ORDER.find(k => A[k].kw.some(w => ql.includes(w))) || 'attention'; if (ql.includes('james')) key = 'james'; if (ql.includes('coach') && !ql.includes('james')) key = 'coach'; }
    this.setState(st => ({ msgs: [...st.msgs, { q }, { loading: true }], draft: '' }));
    this._t = setTimeout(() => this.setState(st => ({ msgs: [...st.msgs.slice(0, -1), { key }] })), 1100);
  }
  renderVals() {
    const app = this.props.app || { lang: 'en' }; const lang = app.lang || 'en', t = T[lang], l = (o) => L(o, lang);
    const prompts = ['attention', 'team', 'coach', 'newrisk', 'cand', 'james', 'funnel'].map(k => ({ q: l(A[k].q), onClick: () => this.ask(l(A[k].q), k) }));
    const msgs = this.state.msgs.map(m => {
      if (m.q) return { user: true, q: m.q };
      if (m.loading) return { loading: true };
      const a = A[m.key];
      return { ai: true, summary: l(a.sum), evidence: l(a.ev), items: a.items.map((it, i) => ({ n: i + 1, name: l(it[0]), reason: l(it[1]), rec: l(it[2]),
        btns: it[3].map(b => ({ label: l(B[b[0]]), onClick: () => app.go(b[1], b[2]) })) })) };
    });
    return { t, prompts, msgs, emptyChat: msgs.length === 0, hasMsgs: msgs.length > 0, draft: this.state.draft,
      modes: t.md.map(m => ({ n: m[0], d: m[1] })), onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && this.state.draft.trim()) this.ask(this.state.draft.trim()); }, send: () => this.state.draft.trim() && this.ask(this.state.draft.trim()) };
  }
}
</script>
</body>
</html>
